# Darman Studio. Start with:  docker compose up -d --build
# Settings come from .env next to this file (copy .env.example).
services:
  app:
    build: ./server
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-80}:3000"
    volumes:
      - studio-data:/data

  # Optional HTTPS once you have a domain: set DOMAIN in .env, then
  #   docker compose --profile https up -d
  # and change HTTP_PORT to 8080 so Caddy can take ports 80 and 443.
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  studio-data:
  caddy-data:
